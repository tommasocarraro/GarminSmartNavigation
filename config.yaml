# GarminSmartNavigation – all tunables live here.
# Gradients are in percent, measured on the DEM (TINITALY 10 m), already converted
# from the rider's barometric limits (see out/calibration/*.json, tools/calibrate.py,
# tools/dem_vs_baro.py). DEM ≈ barometer for windows ≥ 100 m; at 50 m the DEM is
# noisier, so 50 m limits are set slightly higher than the barometric ones.

areas:
  colli_euganei: {bbox: [11.60, 45.23, 11.80, 45.37]}      # lon_min, lat_min, lon_max, lat_max
  montello:      {bbox: [12.00, 45.75, 12.25, 45.85]}
  # trentino_veneto: {boundary_relations: [...]}             # added when scaling up

sources:
  osm_url: https://download.geofabrik.de/europe/italy/nord-est-latest.osm.pbf
  dem: tinitaly            # tinitaly | glo30  (TINITALY matched the barometer better: 50 m corr 0.66 vs 0.59)

rider:
  # Derived from 9 rides (163 km of climbing). Paganella DH ride excluded.
  # Barometric reference: 500 m max 17.5 %, 200 m max 24.5 %, 100 m max 28.7 %,
  # 50 m walls 29–31 % ridden at 5–6 km/h; 33–37 % only at walking pace.
  max_ridden: {100: 28.7, 200: 24.5, 500: 17.5}   # barometric maxima of your climbs (bulk_check compares routes)
  uphill_rock_tolerance: light      # none | light | moderate  (light ≈ mtb:scale 1 uphill OK)

gradient:
  # window_m: [no_penalty_up_to, mild_up_to, strong_up_to]; above the last value:
  #   50 m / 100 m  -> wall: hard block uphill (oneway downhill) unless traces show it is climbed
  #   200 m / 500 m -> also an uphill block (sustained climbs beyond anything ridden: 200 m max 24.5 %, 500 m 17.5 %)
  #   1000 m        -> very strong penalty only
  50:   [28, 33, 40]       # DEM is noisy at 50 m: wall only above 40 % (a 37 % DEM wall was ridden)
  100:  [24, 28, 32]
  200:  [20, 24, 27]       # your max 24.5 % (barometer); DEM ~ barometer from 200 m
  500:  [15, 17.5, 20]     # your max 17.5 %
  1000: [13, 16, 20]
  # On rough/technical ground everything moves one level down (mild -> strong ...)
  rough_shift_level: 1
  # Rough+steep hard block: uphill on rock/scree/very_bad smoothness and 100 m gradient above this
  rough_steep_block_100m: 18

technical:
  mtb_scale_uphill_ok: 1            # mtb:scale (or mtb:scale:uphill) above this = technical uphill
  mtb_scale_block_uphill: 3         # mtb:scale >= this -> oneway downhill (when no mtb:scale:uphill tag)
  mtb_scale_uphill_block: 4         # mtb:scale:uphill >= this -> oneway downhill unless traces climb it
                                    # (3 is speed 0 + rough: blocked only when also steep, see rough_steep_block_100m;
                                    #  blocking all of 3 left 9 % of random destinations unreachable)
  mtb_scale_uphill_rough: 3         # mtb:scale:uphill >= this counts as rough ground
  sac_scale_block: [demanding_alpine_hiking, alpine_hiking, difficult_alpine_hiking]
  bad_smoothness: [horrible, very_horrible, impassable]   # very_bad = 'MTB ok' in OSM; only used when no mtb:scale tag
  bad_surface: [rock, scree, stone, boulders]
  bad_visibility: [bad, horrible, "no"]

traces:
  # Who is a bike? Speeds measured on DEM flats/descents (gradient < +2 %), moving only.
  hike_flatdown_kmh: 7.0      # below: walker/runner -> dropped
  bike_flatdown_kmh: 9.5      # at/above: bike (your rides: ~15 km/h on 0-5 %)
  car_flatdown_kmh: 35.0      # above: motor vehicle
  car_p90_kmh: 55.0
  min_km: 1.0
  max_median_dt_s: 30         # sparser traces can't be matched to twisty trails

traffic:
  k: 1.5                 # confidence weight w = n/(n+k) for n independent uphill traces (1 -> 0.4, 3 -> 0.67)
  walk_kmh: 4.0          # median uphill speed below this = probably pushed -> w halved
  climbed_overrides_block: 2      # >= this many uphill traces cancel a wall / rough-steep / mtb:scale block
  # "Only ridden downhill", counted over the whole trail (OSM way) with net grade >= downhill_only_min_grade:
  min_traces_for_downhill_only_block: 5          # any trail: uphill closed
  min_traces_for_downhill_only_block_tech: 2     # technical trail (mtb:scale or :uphill >= 2): uphill closed
  downhill_only_points: 2.0                      # weaker evidence: uphill points += this * n/(n+k)
  downhill_only_min_grade: 5      # % average over the whole way
  downhill_only_min_len: 150      # m, shorter ways are too short to judge

# ---- Scoring: penalty points -> Garmin road_speed / road_class ----------------------
# Each segment direction collects penalty points; speed = base - round(points).
# Points of the two directions are combined with max (Garmin can't tell directions apart),
# except a hard-blocked direction, which becomes a oneway instead.
scoring:
  base:                      # highway -> [road_speed, road_class] for an ideal segment
    track_good: [5, 1]       # tracktype grade1-3 (forestry roads: the natural e-bike climbs)
    track: [4, 0]            # grade4-5 or no tracktype
    path: [4, 0]
    bridleway: [4, 0]
    cycleway: [4, 1]
    footway: [3, 0]
    pedestrian: [2, 0]
    living_street: [4, 0]
    residential: [4, 0]
    unclassified: [4, 0]
    service: [3, 0]
    road: [3, 0]
    tertiary: [4, 1]
    tertiary_link: [4, 1]
    secondary: [3, 2]
    secondary_link: [3, 2]
    primary: [2, 3]
    primary_link: [2, 3]
    trunk: [1, 3]
    trunk_link: [1, 3]
    motorway: [0, 4]         # no bikes anyway (access)
    motorway_link: [0, 4]
    steps: [0, 0]
  max_speed: 5               # bonuses never push above this
  trail_class_min_speed: 4   # trails reaching this speed get road_class 1 (long routes keep using them)
  low_speed_class0: 2        # any way at or below this speed gets road_class 0
  # BaseCamp bike routing caps every road at ~20 km/h (tools/route_sim.py reproduces its routes only with
  # that cap), so road_speed 1..7 all look the same and only speed 0 (5 km/h = 4x cost) is a real penalty.
  # Strong penalties therefore go straight to speed 0.
  zero_speed_points: 2       # penalty points >= this -> road_speed 0
  gradient_points: [0, 1, 2, 3]   # per gradient level (none / mild / strong / beyond strong)
  rough_grade_scale: 0.7     # on rough ground the gradient limits are multiplied by this
  dem_rough_m: 1.0           # DEM profile roughness counted as rough, only when a trail has no tech tags
  mtb_uphill_points: {2: 0.5, 3: 2, 4: 3, 5: 3, 6: 3}   # uphill grade (mtb:scale:uphill, else mtb:scale); you climb grade 2
  mtb_scale_any_dir: {3: 1, 4: 2, 5: 3, 6: 3}   # hard in both directions
  smoothness: {horrible: 1, very_horrible: 2, impassable: 4}   # only when no mtb:scale tag
  surface: {rock: 1, scree: 2, boulders: 2, stone: 1}
  visibility: {bad: 1, horrible: 2, "no": 2}
  sac_scale: {demanding_mountain_hiking: 1}
  informal: 0.5
  abandoned: 2               # abandoned=yes / disused=yes
  no_traffic: 0.5            # path/footway/bridleway with no bike trace at all
  mtb_route_bonus: 1.0
  uphill_grade_avg: 3        # a direction counts as "uphill" if avg >= this % or worst 100 m >= 2x this
  dismount: 5               # bicycle=dismount: strong soft penalty (speed 0, class 0), still usable as a last resort
  block_access_tags:         # both directions blocked (bicycle=no in the output)
    highway: [steps]
    bicycle: ["no"]
    access: ["no"]

map:
  name: "e-MTB Nord-Est"
  family_id: 7531
  product_id: 1
  contours: true
  contour_interval_m: 20      # major every 100 m
  hill_shading: true
  dem_for_shading: tinitaly
